name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Rungs 1 and 2 without the corpus: decoder, readability, BCD tables.
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  # Rungs 1-3 against SingleStepTests/m68000 at the pinned commit: 127 files,
  # 317,500 cases (docs/validation.md). The 112 MB archive is fetched once
  # per pin and cached.
  corpus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: tests/68000_test_vectors/m68000
          key: m68000-64b253116a3de04aaac4346c43680960dc9b67e5
      - run: test -f tests/68000_test_vectors/m68000/REVISION || python scripts/fetch_test_vectors.py
      - run: python -m pytest -q tests/test_corpus.py tests/test_bcd.py
