name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Everything but the corpus gates: the decoder, readability, the BCD
      # tables, the manual-derived and referee-pinned tests, the tooling.
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python examples/minimal_m68000_host.py
      - run: python examples/interrupt_host.py

  # The SingleStepTests/m68000 gate at the pinned commit: 127 files, 317,500
  # cases, compared on registers, SR, the queue, RAM, clocks and every bus
  # access (docs/validation.md), and the step_clocks claim over the same
  # cases.  The 112 MB archive is fetched once per pin and cached.
  corpus:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - uses: actions/cache@v4
        with:
          path: tests/68000_test_vectors/m68000
          key: m68000-64b253116a3de04aaac4346c43680960dc9b67e5
      - run: test -f tests/68000_test_vectors/m68000/REVISION || python scripts/fetch_test_vectors.py
      - run: python -m pytest -q tests/test_corpus.py tests/test_step_clocks.py tests/test_bcd.py

  # The wheel a release would publish, installed into a clean interpreter and
  # exercised from outside the source tree.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --sdist
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test the installed public API
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/scripts/smoke_installed_package.py
