[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "m68000-python"
version = "0.1.0"
description = "Readable, pure-Python Motorola MC68000 instruction-core reference implementation"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.x); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alewman/m68000-python"
Repository = "https://github.com/alewman/m68000-python"
Issues = "https://github.com/alewman/m68000-python/issues"
Changelog = "https://github.com/alewman/m68000-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Pinned: `ruff format --check` in CI must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/m68000_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".pytest_cache", "tests/68000_test_vectors", "validation/referees/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
# Motorola's register names (D, A, R, SR, PC) are upper case, which ruff
# mistakes for constants (SIM300) and ambiguous names (E741).
ignore = ["SIM300", "E741", "SIM108", "SIM109", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["m68000_python"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["src", "tests", "."]
markers = ["corpus: SingleStepTests/m68000 files (fetched by scripts/fetch_test_vectors.py)"]
